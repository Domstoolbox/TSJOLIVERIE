<title>Qui est là aujourd'hui ? – EDT Joliverie</title>

:root{--bg:#f4f1ea;--ink:#1d1b2e;--muted:#6b6880;--card:#fff;--line:#e4dfd4}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.day{font-size:clamp(34px,6vw,58px);font-weight:900;line-height:1;text-transform:capitalize;letter-spacing:-.02em}
.date{font-size:20px;color:var(--muted);font-weight:700;margin-top:6px}
.clock{font-size:clamp(34px,5vw,52px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.clock span{font-size:.5em;color:var(--muted)}
.bell{font-size:26px;width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;line-height:1}
.bell.on{background:var(--ink)}
.bell.alarm{border-color:#dc2626;background:#fee2e2}
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.ov.show{display:flex}
#confirmOv{background:rgba(20,10,10,.75)}
.box{background:#fff;border:6px solid #dc2626;border-radius:28px;padding:40px 36px;max-width:760px;text-align:center}
.box h3{margin:0 0 12px;font-size:clamp(36px,6vw,64px);font-weight:900;color:#dc2626}
.box p{margin:0 0 30px;font-size:clamp(22px,3vw,32px);font-weight:800}
.box button,.alertStop{font:inherit;font-weight:900;font-size:24px;border-radius:16px;padding:16px 30px;cursor:pointer;margin:6px}
.yes{background:#dc2626;color:#fff;border:none}.no{background:#fff;color:#1d1b2e;border:3px solid #1d1b2e}
#alertOv{background:#dc2626;color:#fff;flex-direction:column;text-align:center;animation:flash 1s steps(1) infinite}
@keyframes flash{50%{background:#7f1d1d}}
#alertOv .big{font-size:clamp(44px,8vw,110px);font-weight:900;line-height:1.05;max-width:1100px}
#alertOv .ico{font-size:clamp(70px,10vw,140px)}
.alertStop{margin-top:40px;background:#fff;color:#dc2626;border:none}
.week{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:26px;padding:10px 20px;border-radius:999px;color:#fff}
.week small{font-size:14px;font-weight:700;opacity:.9}
.wA{background:#2563eb}.wB{background:#ea580c}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav button,.nav input{font:inherit;font-weight:800;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;font-size:16px}

.tabs{display:flex;gap:8px;margin:6px 0 18px}
.tabs button{font:inherit;font-weight:800;font-size:16px;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:#e4dfd4;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.now{background:var(--ink);color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.now b{font-size:18px;margin-right:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06);border:1px solid var(--line)}
.card h2{margin:0;padding:14px 16px;font-size:21px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.card h2 span{font-size:13px;font-weight:800;opacity:.85}
.slot{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:11px 16px;border-top:1px solid var(--line);align-items:center}
.slot.live{background:#fff7cc}
.time{font-weight:900;font-size:15px;line-height:1.15}
.time i{display:block;font-style:normal;color:var(--muted);font-weight:700}
.room{display:inline-block;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;margin-right:6px}
.cls{font-weight:800;font-size:16px}
.tag{font-size:12px;font-weight:800;color:var(--muted);margin-left:4px}
.absent{margin-top:22px;color:var(--muted);font-weight:700}
.absent .chip{background:#fff;border:2px dashed #cfc8b8;color:var(--muted);margin:4px 4px 0 0}
.empty{background:#fff;border-radius:20px;padding:40px;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}
table{table-layout:fixed;border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
.tw{position:relative;overflow-x:auto;background:#fff;border-radius:20px;padding:10px;border:1px solid var(--line)}
th{font-size:15px;font-weight:900;padding:8px;background:var(--ink);color:#fff;border-radius:10px}
th .cap{display:block;font-size:12px;font-weight:700;opacity:.7;margin-top:2px}
td{vertical-align:top;padding:0;height:52px}
th:first-child,td.t{width:80px}td.t{font-weight:900;font-size:13px;white-space:nowrap;padding:6px 8px;color:var(--muted);background:#f4f1ea;border-radius:10px}
.cell{border-radius:10px;padding:6px 8px;font-size:13px;font-weight:800;height:100%;line-height:1.2}
.cell div{font-weight:700;font-size:12px;opacity:.9}
#nowLine{position:absolute;left:10px;height:0;border-top:3px solid #e11d48;pointer-events:none;display:none;z-index:5}
#nowLine:after{content:"";position:absolute;left:-7px;top:-8.5px;width:14px;height:14px;border-radius:50%;background:#e11d48}
.lunch td{height:14px}
footer{margin-top:26px;color:var(--muted);font-size:13px;font-weight:600}
</style>
</head>

  document.getElementById("weekBadge").innerHTML=`<div class="week w${wk}">Semaine ${wk} <small>(${wk==="A"?"paire":"impaire"})</small></div>`;
  document.getElementById("pick").value=ymd(cur);
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const main=document.getElementById("main"),nowEl=document.getElementById("now");
  nowEl.innerHTML="";
  if(dow===0||dow===6){main.innerHTML=`<div class="empty">🌴 C'est le week-end, pas de cours.<br><br><button onclick="goMonday()" style="font:inherit;font-weight:900;border:none;background:#1d1b2e;color:#fff;border-radius:12px;padding:10px 18px;cursor:pointer">Voir lundi ▶</button></div>`;return}
  const list=DATA.filter(x=>x.d===dow&&(x.w===""||x.w===wk)).sort((a,b)=>mins(a.s)-mins(b.s));
  const real=new Date(),isToday=ymd(real)===ymd(cur),nm=real.getHours()*60+real.getMinutes();
  const live=x=>isToday&&nm>=mins(x.s)&&nm<mins(x.e);
  if(isToday){const L=list.filter(live);
    nowEl.innerHTML=`<div class="now"><b>⏱ En ce moment (${String(real.getHours()).padStart(2,"0")}h${String(real.getMinutes()).padStart(2,"0")}) :</b>`+(L.length?L.map(x=>`<span class="chip" style="background:${COLORS[x.p]};color:${txt(COLORS[x.p])}">${x.p.split(" ")[0]} · ${x.r} · ${x.c}</span>`).join(""):`<span style="opacity:.8;font-weight:700">aucun cours en cours pour ces professeurs</span>`)+`</div>`}
  if(view==="prof"){
    const present=TEACHERS.filter(t=>list.some(x=>x.p===t));
    const absent=TEACHERS.filter(t=>!present.includes(t));
    if(!present.length){main.innerHTML=`<div class="empty">Aucun de ces professeurs n'a cours ce jour-là.</div>`;return}
    let h=`<div class="grid">`;
    for(const t of present){const c=COLORS[t],items=list.filter(x=>x.p===t);
      h+=`<div class="card"><h2 style="background:${c};color:${txt(c)}">${t}<span>${items[0].s.replace(":","h")} → ${items[items.length-1].e.replace(":","h")}</span></h2>`;
      for(const x of items)h+=`<div class="slot${live(x)?" live":""}"><div class="time">${hm(x.s)}<i>${hm(x.e)}</i></div><div><span class="room">${x.r}</span><span class="cls">${x.c}</span>${x.w?`<span class="tag">sem. ${x.w} seulement</span>`:""}</div></div>`;
      h+=`</div>`}
    h+=`</div><div class="absent">Pas de cours ce jour-là :<br>${absent.map(t=>`<span class="chip">${t}</span>`).join("")}</div>`;
    main.innerHTML=h;
  }else{
    let h=`<div class="tw"><table><tr><th>Heure</th>${ROOMS.map(r=>`<th>${r}${CAP[r]?`<span class="cap">${CAP[r]} max</span>`:""}</th>`).join("")}</tr>`;
    const covered={};
    SLOTS.forEach((s,i)=>{
      if(!s){h+=`<tr class="lunch"><td colspan="${ROOMS.length+1}"></td></tr>`;return}
      h+=`<tr data-s="${s[0]}" data-e="${s[1]}"><td class="t">${hm(s[0])}<br>${hm(s[1])}</td>`;
      for(const r of ROOMS){
        if(covered[r+i])continue;
        const x=list.find(x=>x.r===r&&x.s===s[0]);
        if(x){let span=0,j=i;while(j<SLOTS.length){if(SLOTS[j]){span++;covered[r+j]=1;if(SLOTS[j][1]===x.e)break}else{span++;covered[r+j]=1}j++}
          const c=COLORS[x.p];
          h+=`<td rowspan="${span}"><div class="cell" style="background:${c};color:${txt(c)}${live(x)?";outline:4px solid #1d1b2e":""}">${x.c}<div>${x.p}${x.w?" · sem. "+x.w:""}</div><div>${hm(x.s)}–${hm(x.e)}</div></div></td>`}
        else h+=`<td></td>`}
      h+=`</tr>`});
    main.innerHTML=h+`</table><div id="nowLine"></div></div>`;
    nowLine();
  }
}
function nowLine(){
  const L=document.getElementById("nowLine");if(!L)return;
  const d=new Date();
  if(ymd(d)!==ymd(cur)){L.style.display="none";return}
  const nm=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  const tw=L.parentElement,base=tw.getBoundingClientRect().top-tw.scrollTop;
  const rows=[...tw.querySelectorAll("tr[data-s]")].map(r=>{const b=r.getBoundingClientRect();return{s:mins(r.dataset.s),e:mins(r.dataset.e),top:b.top-base,bot:b.bottom-base}});
  let y=null;
  for(let i=0;i<rows.length;i++){const r=rows[i];
    if(nm>=r.s&&nm<=r.e){y=r.top+(nm-r.s)/(r.e-r.s)*(r.bot-r.top);break}
    const n=rows[i+1];
    if(n&&nm>r.e&&nm<n.s){y=r.bot+(nm-r.e)/(n.s-r.e)*(n.top-r.bot);break}}
  if(y===null){L.style.display="none";return}
  const tb=tw.querySelector("table");
  const th=tb.querySelectorAll("th")[1],tr=tb.getBoundingClientRect(),hb=th.getBoundingClientRect();
  const x0=hb.left-tr.left+tb.offsetLeft+6;
  L.style.display="block";L.style.top=y+"px";L.style.left=x0+"px";L.style.width=(tb.offsetLeft+tb.offsetWidth-x0)+"px";
}
window.addEventListener("resize",nowLine);
// Sonnerie : 15 s avant chaque début et fin de cours, du lundi au vendredi
const BELLS=[...new Set(SLOTS.filter(Boolean).flat())].map(t=>mins(t)*60-15);
let actx=null,bellOn=false,fired={};
function note(f,t0,dur){const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
  o.type="sine";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2.01;
  const g2=actx.createGain();g2.gain.value=.25;o2.connect(g2).connect(g);o.connect(g).connect(actx.destination);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.start(t0);o2.start(t0);o.stop(t0+dur);o2.stop(t0+dur)}
function melody(){if(!actx)return;const t=actx.currentTime+.05,N=[659.25,523.25,587.33,392,392,587.33,659.25,523.25];
  N.forEach((f,i)=>note(f,t+i*.6+(i>=4?.4:0),i===3||i===7?2.2:1.4))}
function checkBell(){if(!bellOn)return;const d=new Date(),dow=d.getDay();if(dow===0||dow===6)return;
  const sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),key=ymd(d);
  for(const b of BELLS){const k=key+b;if(sec>=b&&sec<b+15&&!fired[k]){fired[k]=1;melody()}}}
document.getElementById("bell").onclick=async()=>{
  const btn=document.getElementById("bell");
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();await actx.resume()}catch(e){return}
  bellOn=!bellOn;btn.textContent=bellOn?"🔔":"🔕";btn.classList.toggle("on",bellOn);btn.classList.toggle("off",!bellOn);
  if(bellOn)melody()};
// Alerte intrusion
const MSG="Merci d'évacuer le bâtiment dans le calme.";
let alarmRun=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function siren(sec){const t0=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type="sawtooth";
  for(let i=0;i<sec*2;i++){o.frequency.setValueAtTime(650,t0+i*.5);o.frequency.linearRampToValueAtTime(1150,t0+i*.5+.45)}
  g.gain.setValueAtTime(.18,t0);g.gain.setValueAtTime(.18,t0+sec-.05);g.gain.linearRampToValueAtTime(0,t0+sec);
  o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+sec);return o}
function speak(){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(MSG);u.lang="fr-FR";u.rate=.9;u.volume=1;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("fr"));if(v)u.voice=v;
  u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,8000)}catch(e){res()}})}
let curSiren=null;
async function runAlarm(){const id=++alarmRun;
  for(let i=0;i<6&&id===alarmRun;i++){curSiren=siren(4);await wait(4300);if(id!==alarmRun)break;await speak();await wait(600)}
  if(id===alarmRun)stopAlarm()}
function stopAlarm(){alarmRun++;try{curSiren&&curSiren.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}document.getElementById("alertOv").classList.remove("show")}
document.getElementById("alarmBtn").onclick=()=>document.getElementById("confirmOv").classList.add("show");
document.getElementById("alarmNo").onclick=()=>document.getElementById("confirmOv").classList.remove("show");
document.getElementById("alarmYes").onclick=async()=>{
  document.getElementById("confirmOv").classList.remove("show");
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();await actx.resume()}catch(e){}
  document.getElementById("alertOv").classList.add("show");if(actx)runAlarm()};
document.getElementById("alarmStop").onclick=stopAlarm;
function shift(n){cur.setDate(cur.getDate()+n);render()}
function goMonday(){while(cur.getDay()!==1)cur.setDate(cur.getDate()+1);render()}
document.getElementById("prev").onclick=()=>shift(-1);
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("today").onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);render()};
document.getElementById("pick").onchange=e=>{if(!e.target.value)return;const[y,m,d]=e.target.value.split("-");cur=new Date(+y,m-1,+d,12);render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;try{localStorage.setItem("edtView",view)}catch(e){}render()});
function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("clock").innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}<span>:${p(d.getSeconds())}</span>`}
tick();setInterval(()=>{tick();nowLine();checkBell()},1000);
render();
setInterval(()=>{if(ymd(new Date())===ymd(cur))render()},60000);
</script>
