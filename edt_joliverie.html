<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qui est là aujourd'hui ? – EDT Joliverie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1d1b2e;--muted:#6b6880;--card:#fff;--line:#e4dfd4}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.day{font-size:clamp(34px,6vw,58px);font-weight:900;line-height:1;text-transform:capitalize;letter-spacing:-.02em}
.date{font-size:20px;color:var(--muted);font-weight:700;margin-top:6px}
.week{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:26px;padding:10px 20px;border-radius:999px;color:#fff}
.week small{font-size:14px;font-weight:700;opacity:.9}
.wA{background:#2563eb}.wB{background:#ea580c}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav button,.nav input{font:inherit;font-weight:800;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;font-size:16px}
.nav button:hover{background:var(--ink);color:#fff}
.nav .today{background:var(--ink);color:#fff}
.tabs{display:flex;gap:8px;margin:6px 0 18px}
.tabs button{font:inherit;font-weight:800;font-size:16px;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:#e4dfd4;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.now{background:var(--ink);color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.now b{font-size:18px;margin-right:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06);border:1px solid var(--line)}
.card h2{margin:0;padding:14px 16px;font-size:21px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.card h2 span{font-size:13px;font-weight:800;opacity:.85}
.slot{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:11px 16px;border-top:1px solid var(--line);align-items:center}
.slot.live{background:#fff7cc}
.time{font-weight:900;font-size:15px;line-height:1.15}
.time i{display:block;font-style:normal;color:var(--muted);font-weight:700}
.room{display:inline-block;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px;margin-right:6px}
.cls{font-weight:800;font-size:16px}
.tag{font-size:12px;font-weight:800;color:var(--muted);margin-left:4px}
.absent{margin-top:22px;color:var(--muted);font-weight:700}
.absent .chip{background:#fff;border:2px dashed #cfc8b8;color:var(--muted);margin:4px 4px 0 0}
.empty{background:#fff;border-radius:20px;padding:40px;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}
table{table-layout:fixed;border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
.tw{overflow-x:auto;background:#fff;border-radius:20px;padding:10px;border:1px solid var(--line)}
th{font-size:15px;font-weight:900;padding:8px;background:var(--ink);color:#fff;border-radius:10px}
td{vertical-align:top;padding:0;height:52px}
th:first-child,td.t{width:80px}td.t{font-weight:900;font-size:13px;white-space:nowrap;padding:6px 8px;color:var(--muted);background:#f4f1ea;border-radius:10px}
.cell{border-radius:10px;padding:6px 8px;font-size:13px;font-weight:800;height:100%;line-height:1.2}
.cell div{font-weight:700;font-size:12px;opacity:.9}
.lunch td{height:14px}
footer{margin-top:26px;color:var(--muted);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="day" id="day"></div><div class="date" id="date"></div></div>
  <div id="weekBadge"></div>
</header>
<div class="nav" style="margin-bottom:14px">
  <button id="prev">◀ Jour précédent</button>
  <button id="today" class="today">Aujourd'hui</button>

<div id="now"></div>

</div>

function txt(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?"#1d1b2e":"#fff"}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function render(){
  const dow=cur.getDay(),wn=isoWeek(cur),wk=wn%2===0?"A":"B";
  document.getElementById("day").textContent=JOURS[dow];
  document.getElementById("date").textContent=cur.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})+" · semaine n°"+wn;

  if(view==="prof"){
    const present=TEACHERS.filter(t=>list.some(x=>x.p===t));

    if(!present.length){main.innerHTML=`<div class="empty">Aucun de ces professeurs n'a cours ce jour-là.</div>`;return}

      for(const x of items)h+=`<div class="slot${live(x)?" live":""}"><div class="time">${hm(x.s)}<i>${hm(x.e)}</i></div><div><span class="room">${x.r}</span><span class="cls">${x.c}</span>${x.w?`<span class="tag">sem. ${x.w} seulement</span>`:""}</div></div>`;
      h+=`</div>`}
    h+=`</div><div class="absent">Pas de cours ce jour-là :<br>${absent.map(t=>`<span class="chip">${t}</span>`).join("")}</div>`;
    main.innerHTML=h;
  }else{
    let h=`<div class="tw"><table><tr><th>Heure</th>${ROOMS.map(r=>`<th>${r}</th>`).join("")}</tr>`;
    const covered={};
    SLOTS.forEach((s,i)=>{
      if(!s){h+=`<tr class="lunch"><td colspan="${ROOMS.length+1}"></td></tr>`;return}
      h+=`<tr><td class="t">${hm(s[0])}<br>${hm(s[1])}</td>`;
      for(const r of ROOMS){
        if(covered[r+i])continue;
        const x=list.find(x=>x.r===r&&x.s===s[0]);
        if(x){let span=0,j=i;while(j<SLOTS.length){if(SLOTS[j]){span++;covered[r+j]=1;if(SLOTS[j][1]===x.e)break}else{span++;covered[r+j]=1}j++}
          const c=COLORS[x.p];
          h+=`<td rowspan="${span}"><div class="cell" style="background:${c};color:${txt(c)}${live(x)?";outline:4px solid #1d1b2e":""}">${x.c}<div>${x.p}${x.w?" · sem. "+x.w:""}</div><div>${hm(x.s)}–${hm(x.e)}</div></div></td>`}
        else h+=`<td></td>`}
      h+=`</tr>`});
    main.innerHTML=h+`</table></div>`;
  }
}
function shift(n){cur.setDate(cur.getDate()+n);render()}
function goMonday(){while(cur.getDay()!==1)cur.setDate(cur.getDate()+1);render()}
document.getElementById("prev").onclick=()=>shift(-1);
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("today").onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);render()};
document.getElementById("pick").onchange=e=>{if(!e.target.value)return;const[y,m,d]=e.target.value.split("-");cur=new Date(+y,m-1,+d,12);render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;try{localStorage.setItem("edtView",view)}catch(e){}render()});
render();
setInterval(()=>{if(ymd(new Date())===ymd(cur))render()},60000);
</script>
