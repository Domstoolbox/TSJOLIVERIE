<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord · Tests et certificats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* ============================================================
   Tableau de bord Domstoolbox · La Joliverie
   Les codes du jour et toutes les données n'apparaissent qu'après connexion avec le mot de passe (onglet Réglages du fichier Google Sheets).
   ============================================================ */
:root{
  --bg:#f3f4f8; --card:#ffffff; --ink:#1b1b1f; --muted:#5d6270; --line:#e2e4ec;
  --teal:#0f766e; --teal-bg:#e0f2f1; --teal-ink:#0f5e57;
  --orange:#c2410c; --orange-bg:#fff1e6; --orange-ink:#9a3412;
  --violet:#6d28d9; --violet-bg:#f3e8ff; --violet-ink:#5b21b6;
  --blue:#1d4ed8; --blue-bg:#eef2ff;
  --green:#15803d; --green-bg:#dcfce7; --green-ink:#14532d;
  --red:#dc2626; --red-bg:#fee2e2; --red-ink:#7f1d1d;
  --yellow:#ca8a04; --yellow-bg:#fefce8;
  --r:16px; --sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --fh:"Space Grotesk",Inter,sans-serif; --fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}

/* ----- Mise en page : tout tient sur un écran ----- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:12px 16px 14px;max-width:1500px;margin:0 auto}
@media (max-width:900px),(max-height:620px){.app{height:auto;min-height:100vh}}

/* ----- En-tête ----- */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.top>div:first-child{min-width:0}
.top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{margin:0;font:700 22px/1.1 var(--fh);letter-spacing:-.01em}
.top h1 span{color:var(--violet)}
.top .sub{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--violet-ink)}
.top .grow{flex:1}
.sync{flex:none;width:132px;height:42px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:0 13px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.sync #syncTxt{overflow:hidden;text-overflow:ellipsis}
.sync i{width:9px;height:9px;border-radius:50%;background:#9ca3af}
.sync.ok i{background:#22c55e;box-shadow:0 0 0 3px #dcfce7}
.sync.ko i{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.sync.busy i{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--sh)}
.ib:hover{background:#f8f9fc}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ----- Barre du haut : codes du jour + interrupteur (même hauteur que les boutons) ----- */
.code[hidden]{display:none!important}
.code{height:42px;display:inline-flex;align-items:center;padding:0 14px;border-radius:12px;color:#fff;font:700 22px var(--fm);letter-spacing:.06em;white-space:nowrap;box-shadow:var(--sh)}
.code.b1{background:var(--teal)} .code.b2{background:var(--orange)}
.switch{height:42px;min-width:118px;border-radius:12px;border:0;display:inline-flex;align-items:center;gap:10px;padding:0 14px 0 8px;color:#fff;box-shadow:var(--sh)}
.switch.on{background:#16a34a} .switch.off{background:#dc2626} .switch.unk{background:#9ca3af}
.switch .knob{flex:none;width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.3);position:relative}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .2s}
.switch.on .knob::after{left:23px}
.switch b{font:700 19px/1 var(--fh);letter-spacing:.04em}
.switch.autre.on{background:#16a34a} .switch.autre.off{background:#dc2626}
.switch.autre{min-width:0;padding-right:12px} .switch.autre b{font-size:15px}
.gap{width:6px}
.idt{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.idt.badge{background:var(--green-bg);color:var(--green-ink)} .idt.autre{background:#fef3c7;color:#92400e} .idt.manuel{background:#ffedd5;color:#9a3412}
tr.nonverif td{background:#fffbeb}
/* ----- Milieu : classes + activité ----- */
.mid{display:grid;grid-template-columns:290px 290px repeat(3,minmax(0,1fr));gap:12px;min-height:0}
.card.vide{background:transparent;border:2px dashed #d5d8e3;box-shadow:none}
/* ----- Tuile « En direct » ----- */
.livelist{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.lv{border-radius:10px;padding:7px 10px;background:var(--bg);display:flex;flex-direction:column;gap:2px;border-left:4px solid #94a3b8}
.lv>div{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.lv b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lv b span{font-weight:500}
.lv small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv em{flex:none;font-size:12.5px}
#liveTag{display:inline-flex;gap:4px;background:none;padding:0}
#liveTag .nb{font:700 12px var(--f);border-radius:999px;padding:2px 8px}
#liveTag .nb.b{background:#dbeafe;color:#1d4ed8} #liveTag .nb.g{background:var(--green-bg);color:var(--green-ink)}
.lv.encours{border-left-color:#2563eb} .lv.alarme{border-left-color:#dc2626;background:#fef2f2} .lv.fini{border-left-color:#16a34a}
.lv em{font-style:normal;font-weight:700;white-space:nowrap}
.lv.encours em{color:#1d4ed8} .lv.alarme em{color:#b91c1c} .lv.fini em{color:#15803d}
/* Activité sous le nom, dans la fenêtre d'une classe */
.stu small{display:block;margin-top:4px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 6px;align-self:flex-start}
.stu small.alarme{background:#fff;color:#b91c1c}
/* ----- Tuile « Post-it » ----- */
.posts{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:2px}
.pi{position:relative;border-radius:4px 4px 14px 4px;padding:8px 10px 6px;box-shadow:0 2px 6px rgba(16,24,40,.12)}
.pi.jaune{background:#fef08a} .pi.rose{background:#fbcfe8} .pi.vert{background:#bbf7d0} .pi.bleu{background:#bfdbfe} .pi.orange{background:#fed7aa}
.pi textarea{display:block;width:100%;border:0;background:transparent;resize:none;font:600 15px/1.35 var(--f);color:#1b1b1f;padding:0;overflow:hidden;min-height:22px}
.pi textarea:focus{outline:none}
.pi .pt{display:flex;justify-content:flex-end;gap:4px;margin-top:2px;opacity:.55}
.pi:hover .pt,.pi:focus-within .pt{opacity:1}
.pi .pt button{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.55);padding:0;font-size:13px;line-height:1;cursor:pointer}
.pi .pt .pc{background:conic-gradient(#fef08a 0 20%,#fbcfe8 0 40%,#bbf7d0 0 60%,#bfdbfe 0 80%,#fed7aa 0)}
.pi .pt .pd.armed{background:#dc2626;color:#fff;border-color:#dc2626}

/* ----- Tuile scanner (webcam) ----- */
.card h2 .grow{flex:1}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;font-size:15px}
.mini svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini input{position:absolute;opacity:0;pointer-events:none}
label.mini:has(input:not(:checked)) span{opacity:.3;filter:grayscale(1)}
#camBtn.on{background:#16a34a;border-color:#16a34a;color:#fff}
.cam{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#111827}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
.cam.on video{display:block}
.camoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b7280;cursor:pointer}
.camoff svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cam.on .camoff{display:none}
.viseur{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.75);border-radius:16px;display:none}
.cam.on .viseur{display:block}
.cam.hit .viseur{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.45)}
.camres{position:absolute;left:8px;right:8px;bottom:8px;border-radius:12px;padding:9px 11px;color:#fff;font-weight:700;font-size:13.5px;line-height:1.3;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.camres.ok{background:#16a34a} .camres.warn{background:#d97706} .camres.ko{background:#dc2626}
.camres b{display:block;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.card h2{margin:0;font:700 17px var(--fh);display:flex;align-items:center;gap:10px}
.card h2 .tag{font:600 12px var(--f);color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 9px}
.classes{display:grid;grid-template-columns:1fr;gap:10px;align-content:start;overflow:auto;min-height:0;padding:2px}
.clsw{position:relative}
.cls{width:100%;border:0;border-radius:14px;padding:16px 96px 16px 18px;text-align:left;color:#fff;display:flex;align-items:center;min-height:84px;box-shadow:var(--sh)}
.cls b{font:700 22px var(--fh);letter-spacing:.01em}
/* Interrupteur de la classe : vert = toute la classe autorisée, rouge = toute la classe bloquée, entre les deux = mélange */
.ctog{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:68px;height:36px;border-radius:999px;border:2px solid rgba(255,255,255,.85);padding:0;background:#dc2626;transition:background .2s}
.ctog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:left .2s}
.ctog.on{background:#16a34a} .ctog.on::after{left:35px}
.ctog.mix{background:linear-gradient(90deg,#dc2626 50%,#16a34a 50%)} .ctog.mix::after{left:19px}

.c0{background:linear-gradient(135deg,#2563eb,#1e40af)} .c1{background:linear-gradient(135deg,#7c3aed,#5b21b6)}
.c2{background:linear-gradient(135deg,#0d9488,#0f766e)} .c3{background:linear-gradient(135deg,#ea580c,#c2410c)}
.c4{background:linear-gradient(135deg,#db2777,#9d174d)} .c5{background:linear-gradient(135deg,#0891b2,#155e75)}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}

.today{border-radius:14px;background:var(--violet-bg);padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.today .day{font:700 20px var(--fh);color:var(--violet-ink)}
.cnt{display:flex;align-items:stretch;height:38px;border-radius:10px;overflow:hidden;background:#fff;font-weight:700}
.cnt span{display:flex;align-items:center}
.cnt span:first-child{flex:1;min-width:0;padding:0 10px;font-size:14px;white-space:nowrap;overflow:hidden}
.cnt span:last-child{flex:none;min-width:46px;justify-content:center;padding:0 8px;background:var(--violet);color:#fff;font:700 18px var(--fm)}
.hist{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.hrow{display:flex;flex-direction:column;gap:2px;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.hrow b{font-weight:600}
.hrow .tests{display:flex;flex-direction:column;gap:1px;color:var(--muted)}
.hrow .tests span{display:flex;justify-content:space-between;gap:8px}
.hrow .tests em{font-style:normal;font-family:var(--fm);font-weight:700;color:var(--ink)}

/* ----- Bas : copies (hauteur fixe, 4 lignes visibles) ----- */
.copies{padding-bottom:12px}
.tbox{height:calc(36px + 4 * 33px);overflow:auto;border:1px solid var(--line);border-radius:12px;scrollbar-gutter:stable}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;font-size:13px}
th{position:sticky;top:0;z-index:1;background:#1b1b1f;color:#fff;font-weight:600;font-size:12px;text-align:left;padding:0 10px;height:36px;white-space:nowrap}
td{padding:0 10px;height:33px;border-top:1px solid var(--line);white-space:nowrap}
tr.alerte td{background:#fdecee}
tr.sf td{background:#ecfdf3}
.src{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.src.env{background:var(--blue-bg);color:var(--blue)} .src.scan{background:var(--orange-bg);color:var(--orange-ink)}
td.n{font-family:var(--fm);color:var(--muted)}

/* ----- Fenêtres ----- */
.ov{position:fixed;inset:0;background:rgba(15,18,30,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.ov[hidden]{display:none}
.win{background:var(--card);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:min(980px,100%);max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;overflow:hidden}
.win.sm{width:min(420px,100%)}
.whead{display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff}
.whead h3{margin:0;font:700 22px var(--fh);flex:1}
.whead .x{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;line-height:1}
.whead .x:hover{background:rgba(255,255,255,.32)}
.wbody{padding:16px 18px;overflow:auto}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.stu{border:0;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:1px;color:#fff;min-height:58px}
.stu b{font-weight:700;font-size:13.5px;letter-spacing:.01em}
.stu span{font-size:13px;opacity:.95}
.stu.ok{background:#16a34a}
.stu.no{background:#dc2626}

/* Connexion */
.login{display:flex;flex-direction:column;gap:12px}
.login p{margin:0;color:var(--muted);font-size:13.5px}
.login input{height:46px;border:1px solid #c8ccd8;border-radius:12px;padding:0 14px;font:600 16px var(--f)}
.login label.rm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.btn{height:44px;border-radius:12px;border:0;padding:0 18px;font-weight:700}
.btn.pri{background:var(--violet);color:#fff} .btn.pri:hover{background:#5b21b6}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.dan{background:var(--red-bg);color:var(--red-ink)}
.msg{font-size:13px;font-weight:600;color:var(--red)}

/* Réglages (roue dentée) */
.set{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;min-height:0}
.set .tabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start}
.set .tab{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;text-align:left;font-weight:700;display:flex;justify-content:space-between}
.set .tab.on{background:var(--violet);border-color:var(--violet);color:#fff}
.set .tab small{font-weight:600;opacity:.75}
.set .add{border:1.5px dashed #b9bfce;background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;color:var(--violet-ink)}
.crow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.crow input{height:40px;border:1px solid #c8ccd8;border-radius:10px;padding:0 12px;font:700 16px var(--fh);flex:1;min-width:160px}
.erows{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 120px 44px 40px;gap:6px;align-items:center}
.erow.h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.erow input{height:36px;border:1px solid #d3d7e2;border-radius:8px;padding:0 10px;font:500 14px var(--f);min-width:0}
.erow input.nom{text-transform:uppercase;font-weight:700}
.erow .sw{width:44px;height:36px;border-radius:8px;border:0}
.erow .sw.ok{background:#16a34a} .erow .sw.no{background:#dc2626}
.erow .del{width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--red);font-size:18px}
.wfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.wfoot .grow{flex:1;font-size:13px;color:var(--muted)}
@media (max-width:1100px){.app{height:auto;min-height:100vh}.mid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(320px,auto)}}
/* ----- Téléphone ----- */
@media (max-width:760px){
  .app{padding:10px 10px 14px;gap:10px}
  .top{flex-wrap:wrap;gap:8px}
  .top>div:first-child{flex:1 1 100%}
  .top h1{white-space:normal;font-size:20px}
  .top .grow,.gap{display:none}
  .code{flex:1 1 calc(50% - 4px);justify-content:center;font-size:20px}
  .switch{flex:1 1 calc(50% - 4px);justify-content:center}
  .sync{flex:1 1 auto;width:auto}
  .cam{flex:none;height:260px}
  .students{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stu{min-height:52px;padding:8px 10px}
  .erow{grid-template-columns:minmax(0,1fr) 108px 40px 36px;row-gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .erow input.nom{grid-column:1/-1}
  .erow.h{display:none}
  .whead{padding:12px 14px} .wbody{padding:12px 14px}
}
@media (max-width:760px){.mid{grid-template-columns:1fr}.card.vide{display:none}.livelist,.posts{max-height:320px}.set{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1b1f;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="sub">Domstoolbox · La Joliverie</div>
      <h1>Tableau de bord <span>tests &amp; certificats</span></h1>
    </div>
    <div class="grow"></div>
    <span class="code b1" id="base1" aria-label="Base 1">—</span>
    <span class="code b2" id="base2" aria-label="Base 2">—</span>
    <button type="button" class="switch unk" id="switch" aria-pressed="false"><span class="knob"></span><b id="swTitle">…</b></button>
    <button type="button" class="switch autre unk" id="swAutre" aria-pressed="false" title="Bouton « AUTRE » dans les tests"><span class="knob"></span><b>AUTRE</b></button>
    <span class="gap"></span>
    <span class="sync" id="sync"><i></i><span id="syncTxt">Connexion…</span></span>
    <button type="button" class="ib" id="btnRefresh" title="Actualiser" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button type="button" class="ib" id="btnGear" title="Classes et élèves" aria-label="Modifier les classes et les élèves"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
    <button type="button" class="ib" id="btnLock" title="Se déconnecter" aria-label="Se déconnecter"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </header>


  <section class="mid">
    <div class="card">
      <h2>Mes classes <span class="tag" id="nbEleves"></span></h2>
      <div class="classes" id="classes"><div class="empty">Chargement…</div></div>
    </div>
    <div class="card">
      <h2>Copies reçues</h2>
      <div class="today"><div class="day" id="todayLbl">—</div><div id="todayCnt"></div></div>
      <div class="hist" id="hist"></div>
    </div>
    <div class="card scan">
      <h2>Scanner <span class="grow"></span>
        <label class="mini" title="Musique de victoire pour un sans-faute"><input type="checkbox" id="winOn" checked aria-label="Musique de victoire pour un sans-faute"><span>🎵</span></label>
        <button type="button" class="mini" id="camSwitch" hidden title="Changer de caméra" aria-label="Changer de caméra"><svg viewBox="0 0 24 24"><path d="M20 7h-3l-2-3H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M9 13.5a3 3 0 0 1 5.2-2M15 12.5a3 3 0 0 1-5.2 2"/></svg></button>
        <button type="button" class="mini" id="camBtn" title="Caméra" aria-label="Allumer ou éteindre la caméra"><svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button></h2>
      <div class="cam" id="camBox">
        <video id="video" playsinline muted></video>
        <div class="camoff" id="camOff"><svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>

        <div class="camres" id="camRes" hidden></div>

    <div class="card post">
      <h2>Post-it <span class="grow"></span><button type="button" class="mini" id="postAdd" title="Nouveau post-it" aria-label="Nouveau post-it"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></h2>
      <div class="posts" id="posts"></div>

  <section class="card copies">
    <h2>Dernières copies <span class="tag" id="nbCopies"></span></h2>
    <div class="tbox" id="tbox">
      <table><thead><tr><th>N°</th><th>Source</th><th>Test</th><th>Nom</th><th>Prénom</th><th>Classe</th><th>Note</th><th>Ramenée (PAP)</th><th>Sur 20</th><th>Date</th><th>Début</th><th>Fin</th><th>Durée</th><th>Code</th><th>Identité</th></tr></thead>
      <tbody id="tbody"></tbody></table>
    </div>
  </section>
</div>

<!-- Connexion -->
<div class="ov" id="ovLogin" hidden>
  <div class="win sm" role="dialog" aria-modal="true" aria-labelledby="lgT">
    <div class="whead" style="background:linear-gradient(135deg,#7c3aed,#5b21b6)"><h3 id="lgT">Connexion</h3></div>
    <div class="wbody login">
      <input type="password" id="pw" autocomplete="current-password" aria-label="Mot de passe" placeholder="Mot de passe">
      <label class="rm"><input type="checkbox" id="pwKeep" checked> Se souvenir sur cet ordinateur</label>
      <div class="msg" id="pwMsg"></div>
      <button type="button" class="btn pri" id="pwGo">Se connecter</button>
    </div>
  </div>
</div>

<!-- Liste d'une classe -->
<div class="ov" id="ovClass" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="clT">
    <div class="whead" id="clHead"><h3 id="clT"></h3><button type="button" class="x" data-close aria-label="Fermer">✕</button></div>
    <div class="wbody">
      <div class="students" id="students"></div>
    </div>
  </div>
</div>

<!-- Roue dentée : classes et élèves -->
<div class="ov" id="ovSet" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="stT">
    <div class="whead" style="background:linear-gradient(135deg,#1b1b1f,#3f3f46)"><h3 id="stT">Classes et élèves</h3><button type="button" class="x" data-close aria-label="Fermer">✕</button></div>
    <div class="wbody">
      <div class="set">
        <div class="tabs" id="setTabs"></div>
        <div id="setPane"></div>
      </div>
    </div>
    <div class="wfoot"><span class="grow" id="setInfo"></span><button type="button" class="btn sec" data-close>Annuler</button><button type="button" class="btn pri" id="setSave">Enregistrer</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
// Adresse /exec du script du fichier « Tableau de Bord - TESTS et CERTIFICATS »
const API = 'https://script.google.com/macros/s/AKfycbwxg9K8-EDTUVq2_KI4VOTDCJBAR2KaAxQzLOPMRFgpHfDwQHT6-aB-m7Kf6egNPojh2w/exec';
const REFRESH_S = 20;                 // actualisation automatique (secondes)
const PW_KEY = 'tdb_mdp';
const TESTS_SUIVIS = ['TEST 008', 'CERTIFICAT COMBUSTION'];   // toujours affichés dans « Aujourd'hui », même à 0

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null, mdp = '', busy = 0;
try { mdp = localStorage.getItem(PW_KEY) || ''; } catch (e) {}

// ---------- Bases du jour (mêmes formules que les tests, date de cet ordinateur) ----------
function bases(now) {
  now = now || new Date();
  const j = now.getDate(), m = now.getMonth() + 1, w = now.getDay();
  const fr = ['D', 'L', 'M', 'M', 'J', 'V', 'S'], en = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const mo = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  return [String(j * 10) + String(m * 10) + fr[w] + mo[m - 1], String(j * 2) + String(m * 2) + en[w] + mo[m % 12]];
}
// Codes du jour affichés seulement après connexion avec le mot de passe (le fichier peut ainsi être publié)
function showBases() {
  const b = S ? bases() : ['', ''];
  $('base1').textContent = b[0]; $('base2').textContent = b[1];
  $('base1').hidden = $('base2').hidden = !S;
}
showBases();
(function atMidnight() { const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5); setTimeout(() => { showBases(); render(); atMidnight(); }, t - n); })();

// Élèves de chaque classe rangés par NOM puis prénom (accents ignorés : É avec E)
const triEleves = l => l.sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr', { sensitivity: 'base' }) || String(a.prenom).localeCompare(String(b.prenom), 'fr', { sensitivity: 'base' }));

// ---------- Échanges avec le script Google ----------
// Largeur fixe ; pendant l'échange, seul le point change de couleur (le texte ne bouge pas)
function setSync(cls, txt) { $('sync').className = 'sync ' + cls; if (txt !== undefined) $('syncTxt').textContent = txt; $('sync').title = $('syncTxt').textContent; }
async function call(action, extra) {
  busy++; setSync('busy');
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, mdp, nbCopies: 300 }, extra || {})), redirect: 'follow' });
    const o = await r.json();
    if (!o.ok) {
      if (o.err === 'mdp') { S = null; render(); askLogin(mdp ? 'Mot de passe refusé.' : ''); setSync('ko', 'Non connecté'); }
      else setSync('ko', 'Erreur : ' + o.err);
      return null;
    }
    (o.classes || []).forEach(c => triEleves(c.eleves));
    S = o; render();
    setSync('ok', 'À jour · ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
    return o;
  } catch (e) {
    setSync('ko', 'Hors ligne');
    return null;
  } finally { busy--; }
}
const refresh = () => { if (mdp && !busy) call('admin'); };
setInterval(() => { if (!document.hidden && $('ovSet').hidden) refresh(); }, REFRESH_S * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
$('btnRefresh').onclick = refresh;

// ---------- Connexion ----------
function askLogin(msg) { $('pwMsg').textContent = msg || ''; $('ovLogin').hidden = false; setTimeout(() => $('pw').focus(), 30); }
async function login() {
  const v = $('pw').value; if (!v) return;
  mdp = v; $('pwGo').disabled = true;
  const o = await call('admin');
  $('pwGo').disabled = false;
  if (o) {
    try { if ($('pwKeep').checked) localStorage.setItem(PW_KEY, v); else localStorage.removeItem(PW_KEY); } catch (e) {}
    $('pw').value = ''; $('ovLogin').hidden = true;
  }
}
$('pwGo').onclick = login;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('btnLock').onclick = () => { try { localStorage.removeItem(PW_KEY); } catch (e) {} mdp = ''; S = null; render(); setSync('', 'Déconnecté'); askLogin(''); };

// ---------- Affichage ----------
const JOURS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function jourLong(dmy) { const [d, m, y] = dmy.split('/').map(Number), dt = new Date(y, m - 1, d); return JOURS[dt.getDay()] + ' ' + d + ' ' + MOIS[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : ''); }
const auj = () => new Date().toLocaleDateString('fr-FR');

function render() {
  showBases();
  // Interrupteur
  const sw = $('switch');
  const sa = $('swAutre');
  sa.className = 'switch autre ' + (!S ? 'unk' : S.autre ? 'on' : 'off'); sa.setAttribute('aria-pressed', !!(S && S.autre));
  if (!S) { sw.className = 'switch unk'; $('swTitle').textContent = '…'; }
  else {
    sw.className = 'switch ' + (S.ouvert ? 'on' : 'off'); sw.setAttribute('aria-pressed', S.ouvert);
    $('swTitle').textContent = S.ouvert ? 'ON' : 'OFF';
  }
  // Classes
  const cl = S ? S.classes : [];
  $('nbEleves').textContent = S ? cl.reduce((a, c) => a + c.eleves.length, 0) + ' élèves' : '';
  $('classes').innerHTML = !S ? '<div class="empty">Connecte-toi pour voir tes classes.</div>' : !cl.length ? '<div class="empty">Aucune classe : ajoute-en avec la roue dentée.</div>' :
    cl.map((c, i) => { const n = c.eleves.length, ok = c.eleves.filter(e => e.ok).length, st = n && ok === n ? 'on' : ok ? 'mix' : '';
      return `<div class="clsw"><button type="button" class="cls c${i % 6}" data-cls="${i}"><b>${esc(c.nom)}</b></button><button type="button" class="ctog ${st}" data-tog="${i}" aria-label="Autoriser ou bloquer toute la classe ${esc(c.nom)}" aria-pressed="${st === 'on'}"></button></div>`; }).join('');
  // Aujourd'hui + historique
  const today = auj(), jours = S ? S.jours : [];
  $('todayLbl').textContent = jourLong(today);
  const tj = (jours.find(j => j.date === today) || { tests: {} }).tests;
  const noms = [...new Set(TESTS_SUIVIS.concat(Object.keys(tj)))];
  $('todayCnt').innerHTML = '<div style="display:flex;flex-direction:column;gap:6px">' + noms.map(t => `<div class="cnt"><span>${esc(t)}</span><span>${tj[t] || 0}</span></div>`).join('') + '</div>';
  // Intitulé toujours sur une ligne : la taille du texte se réduit si l'intitulé est long
  // (même taille pour tous les intitulés : celle qui convient au plus long)
  const lbs = [...$('todayCnt').querySelectorAll('.cnt span:first-child')];
  let fs = 14; const trop = () => lbs.some(el => el.scrollWidth > el.clientWidth + 0.5);
  lbs.forEach(el => el.style.fontSize = fs + 'px');
  while (trop() && fs > 10) { fs -= 0.5; lbs.forEach(el => el.style.fontSize = fs + 'px'); }
  const old = jours.filter(j => j.date !== today);
  $('hist').innerHTML = old.length ? old.map(j => `<div class="hrow"><b>${esc(jourLong(j.date))}</b><span class="tests">${Object.keys(j.tests).map(t => `<span>${esc(t)} <em>${j.tests[t]}</em></span>`).join('')}</span></div>`).join('')
    : '<div class="empty">' + (S ? 'Pas encore d’historique.' : '') + '</div>';
  // Copies : la plus récente en haut ; si on a fait défiler vers le bas, la position est gardée
  const box = $('tbox'), enHaut = box.scrollTop <= 4;
  const cp = S ? S.copies : [], d0 = S ? S.total - cp.length : 0;
  $('nbCopies').textContent = S ? S.total + ' au total' : '';
  $('tbody').innerHTML = cp.map((c, i) => [c, i]).reverse().map(([c, i]) => `<tr class="${c.fraude || c.hors ? 'alerte' : c.identite && c.identite !== 'Badge' ? 'nonverif' : c.sansFaute ? 'sf' : ''}"><td class="n">${d0 + i + 1}</td><td><span class="src ${c.source === 'Scan' ? 'scan' : 'env'}">${c.source === 'Scan' ? 'Scan' : 'Envoi'}</span></td><td>${esc(c.test)}</td><td><b>${esc(c.nom)}</b></td><td>${esc(c.prenom)}</td><td>${esc(c.classe)}</td><td>${esc(c.note)}</td><td>${esc(c.pap)}</td><td>${esc(c.sur20)}</td><td>${esc(c.date)}</td><td>${esc(c.debut)}</td><td>${esc(c.fin)}</td><td>${esc(c.duree)}</td><td>${esc(c.code)}</td><td>${c.identite ? `<span class="idt ${c.identite === 'Badge' ? 'badge' : c.identite === 'AUTRE' ? 'autre' : 'manuel'}">${esc(c.identite)}</span>` : ''}</td></tr>`).join('') ||
    `<tr><td colspan="15" style="color:var(--muted)">${S ? 'Aucune copie reçue pour l’instant.' : ''}</td></tr>`;
  if (enHaut || !render.done) box.scrollTop = 0;
  render.done = true;
  renderLive();
  renderPosts();
  if (!$('ovClass').hidden) renderClass();
}

// ---------- En direct : qui fait quoi aujourd'hui ----------
const cleEl = (c, n, p) => [c, n, p].map(x => String(x || '').trim().toUpperCase()).join('|');
const depuis = h => { const m = /^(\d{1,2}):(\d{2})/.exec(h || ''); if (!m) return ''; const d = new Date(), t = (d.getHours() * 60 + d.getMinutes()) - (+m[1] * 60 + +m[2]); return t > 0 ? t + ' min' : t === 0 ? '< 1 min' : ''; };
function etatTxt(a) { return a.etat === 'fini' ? '✓ ' + String(a.note || 'fini').replace(/\s/g, '') : a.etat === 'alarme' ? '⚠ Alarme' : '⏳ ' + depuis(a.debut); }
function renderLive() {
  const l = S && S.activite ? S.activite.slice() : [];
  const ordre = { alarme: 0, encours: 1, fini: 2 };
  l.sort((a, b) => ordre[a.etat] - ordre[b.etat] || String(b.heure || b.fin || '').localeCompare(String(a.heure || a.fin || '')));
  const nb = k => l.filter(a => a.etat === k).length;
  $('liveTag').innerHTML = S ? `<span class="nb b" title="En cours">⏳ ${nb('encours') + nb('alarme')}</span><span class="nb g" title="Finis">✓ ${nb('fini')}</span>` : '';
  $('live').innerHTML = l.map(a => `<div class="lv ${a.etat}"><div><b>${esc(a.nom)} <span>${esc(a.prenom)}</span></b><em>${esc(etatTxt(a))}</em></div><small>${esc(a.classe)} · ${esc(a.test)}</small></div>`).join('')
    || (S ? '<div class="empty">Aucun élève en test aujourd’hui.</div>' : '');
}

// ---------- Post-it ----------
const COULEURS = ['jaune', 'rose', 'vert', 'bleu', 'orange'];
let POSTS = null, postT = 0;
const enEdition = () => $('posts').contains(document.activeElement);
function renderPosts() {
  if (enEdition()) return;                                   // ne jamais effacer ce que l'on est en train d'écrire
  POSTS = S && S.postits ? S.postits.map(p => Object.assign({}, p)) : [];
  $('posts').innerHTML = !S ? '' : POSTS.map((p, i) => `<div class="pi ${COULEURS.includes(p.couleur) ? p.couleur : 'jaune'}" data-p="${i}"><textarea rows="1" aria-label="Post-it">${esc(p.texte)}</textarea><div class="pt"><button type="button" class="pc" data-pc title="Couleur" aria-label="Changer la couleur"></button><button type="button" class="pd" data-pd title="Supprimer" aria-label="Supprimer">✕</button></div></div>`).join('');
  $('posts').querySelectorAll('textarea').forEach(auto);
}
function auto(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function savePosts(now) { clearTimeout(postT); postT = setTimeout(() => call('postits', { postits: POSTS }), now ? 0 : 1200); }
$('postAdd').onclick = () => {
  if (!S) { askLogin(''); return; }
  POSTS.unshift({ texte: '', couleur: COULEURS[(POSTS.length) % COULEURS.length] }); S.postits = POSTS.map(p => Object.assign({}, p));
  renderPosts(); const t = $('posts').querySelector('textarea'); if (t) t.focus(); savePosts();
};
$('posts').addEventListener('input', e => {
  const n = e.target.closest('[data-p]'); if (!n || e.target.tagName !== 'TEXTAREA') return;
  POSTS[+n.dataset.p].texte = e.target.value; S.postits = POSTS.map(p => Object.assign({}, p)); auto(e.target); savePosts();
});
$('posts').addEventListener('focusout', () => setTimeout(() => { if (!enEdition()) savePosts(true); }, 0));
$('posts').addEventListener('click', e => {
  const n = e.target.closest('[data-p]'); if (!n) return; const i = +n.dataset.p;
  if (e.target.closest('[data-pc]')) { POSTS[i].couleur = COULEURS[(COULEURS.indexOf(POSTS[i].couleur) + 1) % COULEURS.length]; n.className = 'pi ' + POSTS[i].couleur; S.postits = POSTS.map(p => Object.assign({}, p)); savePosts(); }
  if (e.target.closest('[data-pd]')) {
    const b = e.target.closest('[data-pd]');
    if (!b.classList.contains('armed')) { b.classList.add('armed'); setTimeout(() => b.classList.remove('armed'), 2500); return; }
    POSTS.splice(i, 1); S.postits = POSTS.map(p => Object.assign({}, p)); document.activeElement && document.activeElement.blur(); renderPosts(); savePosts(true);
  }
});

// ---------- ON / OFF ----------
$('switch').onclick = async () => {
  if (!S) { askLogin(''); return; }
  S.ouvert = !S.ouvert; render();                       // affichage immédiat
    await call('ouvert', { valeur: S.ouvert });
};

$('swAutre').onclick = async () => {
  if (!S) { askLogin(''); return; }
  S.autre = !S.autre; render();
  await call('autre', { valeur: S.autre });
};

// ---------- Fenêtre d'une classe ----------
let curCls = -1;
// Interrupteur d'une classe : toute la classe en vert, ou toute en rouge si elle était déjà toute verte
$('classes').addEventListener('click', async e => {
  const t = e.target.closest('[data-tog]'); if (!t) return;
  const c = S.classes[+t.dataset.tog], ok = !(c.eleves.length && c.eleves.every(x => x.ok));
  c.eleves.forEach(x => x.ok = ok); render();            // affichage immédiat
  await call('classes', { classes: S.classes });
});
$('classes').addEventListener('click', e => { const b = e.target.closest('[data-cls]'); if (!b) return; curCls = +b.dataset.cls; $('clHead').className = 'whead c' + (curCls % 6); $('ovClass').hidden = false; renderClass(); });
function renderClass() {
  const c = S && S.classes[curCls]; if (!c) { $('ovClass').hidden = true; return; }
  $('clT').textContent = c.nom;
  const act = {};
  (S.activite || []).forEach(a => { const k = cleEl(a.classe, a.nom, a.prenom); if (!act[k] || a.etat !== 'fini' || act[k].etat === 'fini') act[k] = a; });
  $('students').innerHTML = c.eleves.map((e, i) => { const a = act[cleEl(c.nom, e.nom, e.prenom)];
    return `<button type="button" class="stu ${e.ok ? 'ok' : 'no'}" data-i="${i}" aria-pressed="${e.ok}"><b>${esc(e.nom)}</b><span>${esc(e.prenom)}</span>${a ? `<small class="${a.etat}">${esc(a.test)} · ${esc(etatTxt(a))}</small>` : ''}</button>`; }).join('') || '<div class="empty">Aucun élève dans cette classe.</div>';
}
$('students').addEventListener('click', async e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const c = S.classes[curCls], el = c.eleves[+b.dataset.i];
  el.ok = !el.ok; render();                              // affichage immédiat
  await call('eleve', { classe: c.nom, nom: el.nom, prenom: el.prenom, ok: el.ok });
});

// ---------- Roue dentée : classes et élèves ----------
let draft = null, curTab = 0;
$('btnGear').onclick = () => {
  if (!S) { askLogin(''); return; }

function horsSeance(r) {
  const d = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(r.date || '').trim());
  if (!d) return true;
  const now = new Date();
  if (+d[1] !== now.getDate() || +d[2] !== now.getMonth() + 1 || +d[3] !== now.getFullYear()) return true;

function studentBases(dateTxt) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(dateTxt || '').trim());

  const r = parsePayload(txt);
  if (!r) { montre('ko', 'QR code inconnu'); return; }
  r.hors = horsSeance(r);
  if (vus.jour !== auJour()) vus = { jour: auJour(), l: {} };
  const key = ((r.test || '') + '|' + r.nom + '|' + r.prenom + '|' + r.classe).toUpperCase();
  const res = vus.l[key] === r.raw ? 'dup' : vus.l[key] ? 'upd' : 'new';
  vus.l[key] = r.raw; try { localStorage.setItem(STORE + '_vus', JSON.stringify(vus)); } catch (e) {}
  const nomH = `<b>${esc(r.nom.toUpperCase())} ${esc(r.prenom)}</b>`, det = `${esc(r.classe)} · ${esc(r.note)}${r.test ? ' · ' + esc(r.test) : ''}`;
  if (res === 'dup') montre('warn', 'Déjà scannée' + nomH + det);
  else if (!isStudentCode(r)) { montre('ko', nomH + det); fraudSound(); }
  else if (r.hors) { montre('ko', `Hors séance (${esc(r.date)}, ${esc(String(r.fin || '?').slice(0, 5))})` + nomH + det); beep(); setTimeout(() => fraudSound(ANNONCE_HORS), 350); }
  else { montre('ok', (perfect(r) ? '🏆 Sans-faute !' : '') + nomH + det); beep(); if (perfect(r) && winOn()) setTimeout(victory, 250); }
  if (res === 'dup') return;
  const d = new Date();
  const row = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    scanAt: `${two(d.getDate())}/${two(d.getMonth() + 1)}/${d.getFullYear()} ${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`,
    etat: res === 'new' ? 'Nouvelle' : 'Mise à jour', source: 'Tableau de bord',
    test: r.test || '', nom: r.nom.toUpperCase(), prenom: r.prenom, classe: r.classe, note: r.note, notePap: r.notePap || '',
    sur20: Math.round(r.sur20 * 100) / 100, date: r.date, debut: r.debut, fin: r.fin, duree: duree(r.debut, r.fin), code: r.code,
    hors: !!r.hors, fraude: !isStudentCode(r), sansFaute: perfect(r), cle: r.cle || ''
  };
  DEST.forEach(dst => { dst.q.push(Object.assign({}, row)); qSave(dst); });
  flush();
}

// ----- Webcam -----
const video = $('video'), box = $('camBox'), cv = document.createElement('canvas');
let stream = null, devices = [], devIdx = -1, lastTxt = '', lastAt = 0;
try { devIdx = +(localStorage.getItem(STORE + '_cam') ?? -1); } catch (e) {}
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { montre('ko', 'Caméra indisponible'); return; }
  stopCam(true);
  try {
    devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const c = devIdx >= 0 && devices[devIdx] && devices[devIdx].deviceId ? { deviceId: { exact: devices[devIdx].deviceId } } : {};
    stream = await navigator.mediaDevices.getUserMedia({ video: Object.assign(c, { width: { ideal: 1280 }, height: { ideal: 720 } }), audio: false });
  } catch (e) { montre('ko', 'Caméra refusée'); stopCam(); return; }
  video.srcObject = stream; await video.play().catch(() => {});
  box.classList.add('on'); $('camBtn').classList.add('on');
  try {
    devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const id = stream.getVideoTracks()[0].getSettings().deviceId; devIdx = Math.max(0, devices.findIndex(d => d.deviceId === id));
    $('camSwitch').hidden = devices.length < 2;
  } catch (e) {}
  try { localStorage.setItem(STORE + '_on', '1'); } catch (e) {}
  requestAnimationFrame(tick);
}
function stopCam(keep) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; box.classList.remove('on'); $('camBtn').classList.remove('on');
  if (!keep) try { localStorage.setItem(STORE + '_on', '0'); } catch (e) {}
}
function tick() {
  if (!stream) return;
  if (video.readyState >= 2 && video.videoWidth) {
    const w = Math.min(800, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
    cv.width = w; cv.height = h;
    cv.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0, w, h);
    const txt = decodeCanvas(cv), now = Date.now();
    if (txt && !(txt === lastTxt && now - lastAt < 3000)) {
      lastTxt = txt; lastAt = now;
      box.classList.add('hit'); setTimeout(() => box.classList.remove('hit'), 600);
      addPayload(txt);
    } else if (txt) lastAt = now;                       // même copie toujours devant la caméra : pas de répétition
  }
  setTimeout(() => requestAnimationFrame(tick), 120);
}
$('camBtn').onclick = () => stream ? stopCam() : startCam();
$('camOff').onclick = () => startCam();
$('camSwitch').onclick = () => { if (devices.length) { devIdx = (devIdx + 1) % devices.length; try { localStorage.setItem(STORE + '_cam', devIdx); } catch (e) {} startCam(); } };
let auto = false; try { auto = localStorage.getItem(STORE + '_on') === '1'; } catch (e) {}
if (auto) startCam();                                     // caméra rallumée automatiquement si elle l'était
window.tdbScan = addPayload;                              // (essais)
})();
</script>
